packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@next/eslint-plugin-next@16.4.1'
  - '@turbo/darwin-64@2.11.8'
  - '@turbo/darwin-arm64@2.11.8'
  - '@turbo/linux-64@2.11.8'
  - '@turbo/linux-arm64@2.11.8'
  - '@turbo/windows-64@2.11.8'
  - '@turbo/windows-arm64@2.11.8'
  - turbo@2.11.8
  - react-dom@19.3.1
  - react@19.3.1
  - lucide-react@1.57.0
  - '@playwright/test@1.64.1'
  - playwright-core@1.64.1
  - playwright@1.64.1
  - '@expo/metro-runtime@57.0.17'
  - '@expo/ui@57.0.24'
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-notifications@57.0.23
  - expo-router@57.0.27
  - '@anthropic-ai/sdk@0.135.0'

# Dependency install scripts are blocked unless listed here (supply-chain safety).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  # Usage telemetry only — not needed.
  '@scarf/scarf': false
  # File watcher used by dev tooling; ships prebuilt binaries.
  '@parcel/watcher': false
  # Used by tsx; the platform binary comes from an optional dependency.
  esbuild: false

# Security overrides for vulnerable transitive dependencies (pnpm audit).
# Remove once upstream packages ship the fixed versions.
overrides:
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1

# Accepted audit findings. Each entry needs a reason and is reviewed every phase.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 ReDoS-style stack exhaustion; no patched version exists.
    # Reached only via @next/eslint-plugin-next at lint time with our own
    # glob patterns — never at runtime and never with user input.
    - GHSA-vfj7-8cjw-p6xm
    # node-forge <=1.4.0 (no patched version): only in @expo/cli (dev server,
    # code-signing tooling) at build time — not in the app bundle or the server.
    - GHSA-86w9-cpqp-85rv
    # uuid <11.1.1 bounds check in v3/v5/v6 with a caller buffer: reached only
    # via `xcode` during `expo prebuild` (iOS project generation), which uses v4.
    - GHSA-w5hq-g745-h8pq
    # decode-uri-component <=0.4.2 slow decoding of malformed input: used by
    # expo-router's query-string in the app; worst case a crafted deep link
    # slows the user's own app. The fix (0.5, ESM-only) is incompatible with
    # query-string 7; revisit with the next Expo SDK.
    - GHSA-vcc3-ghjq-m6fr
