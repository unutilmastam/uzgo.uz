name: Mobile app

# Manual builds of the mobile app (ADR 0022, docs/MOBILE.md). Run from the
# GitHub app: Actions → Mobile app → Run workflow.
#  - android-apk: an installable test APK built on GitHub (no accounts needed),
#    downloadable from the run's artifacts.
#  - eas: store/TestFlight builds on Expo's servers (needs EXPO_TOKEN and
#    EAS_PROJECT_ID secrets; iOS also needs an Apple developer account).
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [android-apk, eas-preview, eas-production]
        default: android-apk
      api_url:
        description: API origin baked into the app (e.g. https://example.uz)
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-apk:
    name: Android test APK
    if: inputs.target == 'android-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Use the runner's Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Check the API origin
        run: |
          [[ "$EXPO_PUBLIC_API_URL" =~ ^https://[a-z0-9.-]+(:[0-9]+)?$ ]] ||
            { echo "::error::api_url must be an https origin, e.g. https://example.uz"; exit 1; }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @uzgo/contracts build
      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Build release APK (test signing)
        working-directory: apps/mobile/android
        # Signed with the debug key: for installing on test phones only, never
        # for the store (store builds go through EAS with the upload key).
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uzgo-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  eas:
    name: EAS build (${{ inputs.target }})
    if: inputs.target != 'android-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile-release
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      PROFILE: ${{ inputs.target == 'eas-production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check secrets
        run: |
          [[ -n "$EXPO_TOKEN" && -n "$EAS_PROJECT_ID" ]] ||
            { echo "::error::Set EXPO_TOKEN and EAS_PROJECT_ID (docs/MOBILE.md)"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Start the build on Expo (results appear in the Expo dashboard)
        working-directory: apps/mobile
        run: >
          pnpm dlx eas-cli@24.14.0 build --platform all --non-interactive --no-wait
          --profile "$PROFILE"
